<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="titlebar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#19243b" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="meter-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9100" />
      <stop offset="70%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#d50000" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      }
      .t-dim { fill: #4a5d78; }
      .t-white { fill: #e2e8f0; }
      .t-cyan { fill: #00d4ff; font-weight: 600; }
      .t-green { fill: #10b981; font-weight: 600; }
      .t-red { fill: #ff1744; font-weight: 700; }
      .t-orange { fill: #ff9100; font-weight: 600; }
      .t-yellow { fill: #facc15; }
      .t-purple { fill: #a78bfa; }

      /* Animation keyframes */
      @keyframes seqPhase1 {
        0%, 100% { opacity: 1; }
      }
      @keyframes seqPhase2 {
        0%, 12% { opacity: 0; }
        16%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes seqPhase3 {
        0%, 28% { opacity: 0; }
        32%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes seqPhase4 {
        0%, 46% { opacity: 0; }
        50%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes seqPhase5 {
        0%, 64% { opacity: 0; }
        68%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes seqMeter {
        0%, 66% { width: 0; }
        74%, 95% { width: 300px; }
        100% { width: 0; }
      }
      @keyframes seqPhasePrompt {
        0%, 78% { opacity: 0; }
        82%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .anim-cmd { animation: seqPhase1 14s infinite ease-in-out; }
      .anim-init { animation: seqPhase2 14s infinite ease-in-out; }
      .anim-target { animation: seqPhase3 14s infinite ease-in-out; }
      .anim-findings { animation: seqPhase4 14s infinite ease-in-out; }
      .anim-score { animation: seqPhase5 14s infinite ease-in-out; }
      .anim-meter { animation: seqMeter 14s infinite cubic-bezier(0.16, 1, 0.3, 1); }
      .anim-prompt { animation: seqPhasePrompt 14s infinite ease-in-out; }
      .cursor { animation: cursorBlink 0.9s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="10" y="10" width="920" height="540" rx="12" fill="url(#bg-grad)" stroke="#1e2c47" stroke-width="2" />

  <!-- Window Titlebar -->
  <path d="M 10 22 C 10 15 15 10 22 10 L 918 10 C 925 10 930 15 930 22 L 930 46 L 10 46 Z" fill="url(#titlebar-grad)" stroke="#1e2c47" stroke-width="1" />
  
  <!-- Terminal Window Controls -->
  <circle cx="34" cy="28" r="6" fill="#ff5f56" />
  <circle cx="54" cy="28" r="6" fill="#ffbd2e" />
  <circle cx="74" cy="28" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="470" y="32" text-anchor="middle" font-size="12" fill="#718096" font-weight="600">threatlens-security-suite ~ v1.0.0 [Sentinel] — 920x540</text>
  <rect x="830" y="21" width="84" height="15" rx="3" fill="#00d4ff15" stroke="#00d4ff40" stroke-width="1" />
  <text x="872" y="32" text-anchor="middle" font-size="9" fill="#00d4ff" font-weight="700">ZERO-FP CORE</text>

  <!-- Interactive Terminal Content -->
  <g transform="translate(30, 68)">

    <!-- Phase 1: Command Prompt Input -->
    <g class="anim-cmd">
      <text x="0" y="16" font-size="13" class="t-cyan">secops@threatlens-core</text>
      <text x="178" y="16" font-size="13" class="t-dim">:</text>
      <text x="190" y="16" font-size="13" class="t-purple">~/samples</text>
      <text x="268" y="16" font-size="13" class="t-white">$ python threatlens.py --file banking_trojan.apk</text>
    </g>

    <!-- Phase 2: Engine Initialization Banner -->
    <g class="anim-init">
      <!-- Mini ASCII Header & Telemetry -->
      <text x="0" y="44" font-size="11" class="t-cyan">[*] THREATLENS STATIC ANALYSIS ENGINE v1.0.0 [CODENAME: SENTINEL]</text>
      <text x="0" y="62" font-size="11" class="t-green">[OK] Disassembly pipeline mounted (AXML / DEX / Libs / PE)</text>
      <text x="460" y="62" font-size="11" class="t-green">[OK] 15+ Advanced YARA rule engines active</text>
      <text x="0" y="78" font-size="11" class="t-green">[OK] Autonomous learning database online (offline cache)</text>
      <text x="460" y="78" font-size="11" class="t-green">[OK] Zero-FP network heuristic pipeline initialized</text>
      <line x1="0" y1="90" x2="880" y2="90" stroke="#1c2940" stroke-width="1" />
    </g>

    <!-- Phase 3: Target Specification Panel -->
    <g class="anim-target">
      <rect x="0" y="100" width="880" height="52" rx="6" fill="#10192b" stroke="#1d2e4a" stroke-width="1" />
      <text x="16" y="121" font-size="10.5" class="t-dim">TARGET FILE:</text>
      <text x="110" y="121" font-size="10.5" class="t-white">com.malware.bankbot.apk</text>
      <text x="350" y="121" font-size="10.5" class="t-dim">PAYLOAD SIZE:</text>
      <text x="450" y="121" font-size="10.5" class="t-white">4.82 MB (5,054,120 bytes)</text>
      <text x="690" y="121" font-size="10.5" class="t-dim">ARCH:</text>
      <text x="734" y="121" font-size="10.5" class="t-cyan">Android APK</text>
      
      <text x="16" y="141" font-size="10" class="t-dim">SHA-256:</text>
      <text x="82" y="141" font-size="10" class="t-yellow">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>
    </g>

    <!-- Phase 4: Forensics Findings -->
    <g class="anim-findings">
      <!-- Findings Row 1: Dangerous Combinations -->
      <rect x="0" y="162" width="430" height="96" rx="6" fill="#121a2c" stroke="#253553" stroke-width="1" />
      <text x="14" y="182" font-size="10.5" class="t-red">[!!] DANGEROUS PERMISSION COMBINATION</text>
      <text x="14" y="201" font-size="9.5" class="t-white">Pattern: SMS Interception &amp; Covert Banking Exfiltration</text>
      <text x="14" y="219" font-size="9.5" class="t-dim">Perms: SEND_SMS, RECEIVE_SMS, READ_PHONE_STATE, SYSTEM_ALERT</text>
      <text x="14" y="238" font-size="9.5" class="t-orange">Risk Vector: Intercepts 2FA OTP codes &amp; draws fake overlays</text>

      <!-- Findings Row 2: Deep Heuristics & Anti-Analysis -->
      <rect x="450" y="162" width="430" height="96" rx="6" fill="#121a2c" stroke="#253553" stroke-width="1" />
      <text x="464" y="182" font-size="10.5" class="t-orange">[!] DEEP HEURISTICS &amp; EVASION DETECTED</text>
      <text x="464" y="201" font-size="9.5" class="t-white">Anti-VM: Checks for QEMU, Goldfish, Genymotion virtual pipes</text>
      <text x="464" y="219" font-size="9.5" class="t-white">Anti-Debug: android.os.Debug.isDebuggerConnected() detected</text>
      <text x="464" y="238" font-size="9.5" class="t-red">Root Check: /system/xbin/su query + Frida server probe [CRIT]</text>

      <!-- Network Indicators Panel -->
      <rect x="0" y="268" width="880" height="52" rx="6" fill="#121a2c" stroke="#ff174430" stroke-width="1" />
      <text x="14" y="287" font-size="10.5" class="t-red">[NET-IOC] EXTRACTED C2 NETWORK INDICATORS (ZERO-FP PIPELINE)</text>
      <text x="14" y="306" font-size="9.5" class="t-white">C2 IP: <tspan class="t-red">185.220.101.5:8080</tspan> [TOR Exit / RAT Port] (Conf: 96%)</text>
      <text x="440" y="306" font-size="9.5" class="t-white">C2 URL: <tspan class="t-red">hxxp://telemetry-update.darknet/gate.php</tspan> (Conf: 92%)</text>
    </g>

    <!-- Phase 5: Threat Assessment Matrix & Meter -->
    <g class="anim-score">
      <rect x="0" y="330" width="880" height="118" rx="8" fill="#140f1a" stroke="#ff1744" stroke-width="1.5" />
      <rect x="0" y="330" width="880" height="23" rx="8" fill="#ff174420" />
      <text x="440" y="346" text-anchor="middle" font-size="10.5" class="t-red" font-weight="700">=== THREAT ASSESSMENT MATRIX ===</text>

      <!-- Left Column: Score, Meter & Category Weights -->
      <text x="18" y="375" font-size="11" class="t-white">THREAT SCORE: <tspan class="t-red" font-size="14">92 / 100</tspan></text>
      <rect x="230" y="362" width="135" height="18" rx="4" fill="#ff174430" stroke="#ff1744" stroke-width="1" />
      <text x="297" y="375" text-anchor="middle" font-size="10" class="t-red" font-weight="700">[ CRITICAL THREAT ]</text>

      <!-- Animated Progress Gauge -->
      <text x="18" y="403" font-size="11" class="t-dim">[</text>
      <rect x="28" y="394" width="310" height="11" rx="3" fill="#222b3d" />
      <rect x="28" y="394" width="0" height="11" rx="3" fill="url(#meter-fill)" class="anim-meter" />
      <text x="345" y="403" font-size="10.5" class="t-dim">]  92%</text>

      <text x="18" y="428" font-size="9.5" class="t-white">Breakdown: <tspan class="t-red">Perms +30</tspan> | <tspan class="t-red">C2 +28</tspan> | <tspan class="t-red">Evasion +25</tspan> | <tspan class="t-yellow">Combos +9</tspan></text>

      <!-- Center Divider -->
      <line x1="435" y1="360" x2="435" y2="436" stroke="#ff174435" stroke-width="1" />

      <!-- Right Column: Vault Commitment & Telemetry (Guaranteed fits inside box) -->
      <text x="452" y="375" font-size="9.5" class="t-green">[OK] Local Vault: +2 IOCs committed to offline database</text>
      <text x="452" y="398" font-size="9.5" class="t-cyan">[OK] Telemetry: ./reports/threatlens_bankbot_2026.json</text>
      <text x="452" y="421" font-size="9.5" class="t-orange">[OK] Static Triage Verdict: MALICIOUS (Action: QUARANTINE)</text>
    </g>

    <!-- Phase 6: Scan Complete - Returning Shell Prompt at Bottom -->
    <g class="anim-prompt">
      <text x="0" y="466" font-size="13" class="t-cyan">secops@threatlens-core</text>
      <text x="178" y="466" font-size="13" class="t-dim">:</text>
      <text x="190" y="466" font-size="13" class="t-purple">~/samples</text>
      <text x="268" y="466" font-size="13" class="t-white">$</text>
      <rect x="282" y="455" width="8" height="14" fill="#00d4ff" class="cursor" />
    </g>

  </g>
</svg>
